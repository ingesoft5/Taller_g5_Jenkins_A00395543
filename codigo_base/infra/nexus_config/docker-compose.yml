# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Sonatype Nexus (repositorio de artefactos: maven-releases + docker-hosted)
#
# Complete los TODOs para levantar Nexus.
# =============================================================================
version: "3.9"

services:
  nexus:
    image: sonatype/nexus3:3.68.1
    container_name: nexus
    networks:
      - cicd_network
    ports:
      - "${NEXUS_UI_PORT:-8081}:8081"
      - "${NEXUS_DOCKER_REGISTRY_PORT:-8082}:8082"
    volumes:
      - "nexus_data:/nexus-data"
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  cicd_network:
    external: true

volumes:
  nexus_data:
